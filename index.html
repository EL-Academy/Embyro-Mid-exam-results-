<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mid Exam Embryology Result (30)</title>

<style>
  body{
    font-family: Arial, sans-serif;
    background:#f7f7f7;
    margin:0;
    padding:20px;
  }

  .box{
    max-width:520px;
    margin:auto;
    background:#fff;
    border-radius:12px;
    padding:18px;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
  }

  /* Logo */
  .logo-wrap{
    text-align:center;
    margin-bottom:12px;
  }
  .logo-wrap img{
    width:90px;
    height:90px;
    object-fit:contain;
    border-radius:50%;
    background:#ffffff;
    padding:8px;
    box-shadow:0 2px 6px rgba(0,0,0,.08);
  }
  .logo-fallback{
    display:none;
    font-size:12px;
    color:#64748b;
    margin-top:6px;
  }

  h1{
    font-size:18px;
    margin:4px 0;
    color:#1e3a8a;
    text-align:center;
  }

  .sub{
    font-size:13px;
    color:#64748b;
    text-align:center;
    margin:10px 0 14px;
  }

  input{
    width:100%;
    padding:12px;
    font-size:16px;
    border:1px solid #d1d5db;
    border-radius:10px;
    outline:none;
  }
  input:focus{border-color:#1e3a8a;}

  button{
    margin-top:10px;
    width:100%;
    padding:12px;
    font-size:16px;
    border:0;
    border-radius:10px;
    background:#1e3a8a;
    color:#fff;
    cursor:pointer;
  }
  button:active{transform:translateY(1px);}

  .result{
    margin-top:14px;
    padding:12px;
    border-radius:10px;
    background:#f1f5f9;
    border:1px solid #e2e8f0;
  }

  .error{
    margin-top:10px;
    color:#b91c1c;
    text-align:center;
  }

  .row{margin:6px 0;}
  .label{font-weight:700;}
</style>
</head>

<body>
  <div class="box">


    <!-- TITLES -->
    <h1>IBN Sina University</h1>
    <h1>Faculty of Medicine</h1>
    <h1>Mid Exam Embryology Result (30)</h1>

    <div class="sub">Enter your password to view your result</div>

    <!-- PASSWORD INPUT -->
    <input
      id="sid"
      type="password"
      placeholder="Enter your password"
      inputmode="text"
      autocomplete="off"
      autocapitalize="none"
      spellcheck="false"
    />

    <button id="btn">View Result</button>

    <div id="msg" class="error" style="display:none;"></div>
    <div id="out" class="result" style="display:none;"></div>
  </div>

<script>
let LOOKUP = null; // password -> record

async function loadData(){
  const res = await fetch("results.json", { cache: "no-store" });
  if(!res.ok) throw new Error("Could not load results.json");

  const raw = await res.json();

  // Supports both formats:
  // 1) { "results": [ {Name, Password, Result}, ... ] }  (your file)
  // 2) { "Abc123": {name:"", result:""} } (old style)
  if (raw && Array.isArray(raw.results)) {
    LOOKUP = {};
    raw.results.forEach(r => {
      const pw = (r.Password ?? "").toString().trim();
      if (!pw) return; // skip empty passwords
      LOOKUP[pw] = {
        Name: (r.Name ?? "").toString().trim(),
        Result: (r.Result ?? "").toString().trim()
      };
    });
  } else if (raw && typeof raw === "object") {
    // fallback: assume it's already keyed by password
    LOOKUP = raw;
  } else {
    throw new Error("Invalid results.json format");
  }
}

function showError(text){
  const msg = document.getElementById("msg");
  msg.textContent = text;
  msg.style.display = "block";
  document.getElementById("out").style.display = "none";
}

function showResult(rec){
  document.getElementById("msg").style.display = "none";
  const out = document.getElementById("out");
  out.style.display = "block";

  // Support both record styles
  const name = (rec.Name ?? rec.name ?? "").toString();
  const result = (rec.Result ?? rec.result ?? "").toString();

  out.innerHTML = `
    <div class="row"><span class="label">Name:</span> <span dir="auto">${escapeHtml(name)}</span></div>
    <div class="row"><span class="label">Result:</span> <span dir="auto">${escapeHtml(result)}</span></div>
  `;
}

function escapeHtml(str){
  return str
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

async function lookup(){
  try{
    if(!LOOKUP) await loadData();

    const pw = document.getElementById("sid").value.trim();
    if(!pw) return showError("Please enter your password.");

    const rec = LOOKUP[pw];
    if(!rec) return showError("Password not found. Please check and try again.");

    showResult(rec);
  }catch(e){
    console.error(e);
    showError("System error loading results. Please contact the course admin.");
  }
}

document.getElementById("btn").addEventListener("click", lookup);
document.getElementById("sid").addEventListener("keydown", (e) => {
  if(e.key === "Enter") lookup();
});
</script>
</body>
</html>
